name: Gitflow CI - Feature to Dev

on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build_test_and_merge:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore DeunaCall.slnx || dotnet restore

    - name: Check Code Formatting
      run: dotnet format --verify-no-changes
      continue-on-error: true

    - name: Build Solution
      run: dotnet build --no-restore --configuration Release

    - name: Auto-Merge to Dev
      if: success() && github.event_name == 'push'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git checkout dev || git checkout -b dev origin/dev
        git merge ${{ github.ref_name }} --no-ff -m "Merge feature ${{ github.ref_name }} into dev after successful CI"
        git push origin dev
